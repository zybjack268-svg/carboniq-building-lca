<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarbonIQ · 模型配置</title>
<style>
  body{font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#eef7f1;color:#173b30;margin:0;padding:36px}
  main{max-width:440px;margin:auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 18px 55px #1745321c}
  h1{margin:0 0 8px;font-size:24px}p{color:#567367;margin:0 0 18px}label{display:block;margin:14px 0;font-weight:600}
  input{display:block;box-sizing:border-box;width:100%;margin-top:5px;border:1px solid #aac8b9;border-radius:9px;padding:11px;font:inherit}
  button{width:100%;border:0;border-radius:9px;background:#277b59;color:white;padding:12px;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.55}small{display:block;margin-top:15px;color:#60796b}#error{color:#b23a3a;min-height:1.5em}
</style>
<main>
  <h1>配置 CarbonIQ 模型</h1>
  <p>首次启动时填写 OpenAI 兼容接口。配置仅保存在这台电脑的应用数据目录。</p>
  <form id="config">
    <label>Base URL<input name="baseUrl" type="url" placeholder="https://example.com/v1" required></label>
    <label>模型 ID<input name="model" autocomplete="off" required></label>
    <label>API Key<input name="apiKey" type="password" autocomplete="off" required></label>
    <div id="error" role="alert"></div>
    <button type="submit">保存并启动</button>
  </form>
  <small>远程接口必须使用 HTTPS。本应用在本机启动服务，API Key 不会嵌入安装包。</small>
</main>
<script>
  document.getElementById('config').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button');
    button.disabled = true;
    document.getElementById('error').textContent = '';
    const result = await window.carboniqDesktop.saveConfig(Object.fromEntries(new FormData(form)));
    if (!result.ok) { document.getElementById('error').textContent = result.message; button.disabled = false; }
  });
</script>
</html>
